name: Project quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-checks:
    name: Offline source and regression checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out complete history without persisting credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up laptop-test Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.11'
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install hosted-test dependencies only
        run: python -m pip install -r .github/ci-requirements.txt
      - name: Audit public source history
        run: |
          mkdir -p tmp/ci
          python Tools/publication_audit.py --output tmp/ci/publication-audit.json
      - name: Run the existing offline checker
        run: >-
          python Tools/quality_check.py
          --python "$(command -v python)"
          --hub-python "$(command -v python)"
          --node "$(command -v node)"
          --output tmp/ci/quality
      - name: Preserve test reports, including failures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: offline-quality-${{ github.run_id }}
          path: tmp/ci/
          retention-days: 7
          if-no-files-found: warn
